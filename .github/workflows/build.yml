name: build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ESPUP_VERSION: v0.17.1
  ESPFLASH_VERSION: v4.6.0

jobs:
  # Логика без железа: обычный stable Rust, тесты гоняются прямо на раннере.
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      # версия и компоненты берутся из core/rust-toolchain.toml
      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

  # Прошивка: Xtensa-тулчейн от espup, сборка + готовый образ для прошивки.
  esp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esp
    env:
      # espup ходит в GitHub API за релизами — с токеном не упрёмся в лимиты
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install espup and espflash
        working-directory: .
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL -o ~/.local/bin/espup \
            "https://github.com/esp-rs/espup/releases/download/${ESPUP_VERSION}/espup-x86_64-unknown-linux-gnu"
          chmod +x ~/.local/bin/espup
          curl -fsSL -o espflash.zip \
            "https://github.com/esp-rs/espflash/releases/download/${ESPFLASH_VERSION}/espflash-x86_64-unknown-linux-gnu.zip"
          unzip -o espflash.zip -d ~/.local/bin && rm espflash.zip
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Xtensa toolchain
        run: |
          espup install --targets esp32
          # то же, что `. ~/export-esp.sh`, но для всех следующих шагов
          source ~/export-esp.sh
          echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"
          echo "$PATH" | tr ':' '\n' | grep xtensa >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: esp

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Collect images
        run: |
          mkdir -p ../dist
          ELF=target/xtensa-esp32-none-elf/release/soundwave
          cp "$ELF" ../dist/soundwave.elf
          # загрузчик + таблица разделов + приложение одним файлом, шьётся с адреса 0x0
          espflash save-image --chip esp32 --merge --skip-padding "$ELF" ../dist/soundwave.bin

      - uses: actions/upload-artifact@v4
        with:
          name: soundwave-${{ github.sha }}
          path: dist/*

  release:
    needs: [core, esp]
    # релизы только из main, пуши в dev и PR проходят лишь проверки
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: soundwave-${{ github.sha }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          gh release create "build-${SHORT_SHA}" dist/* \
            --target "$GITHUB_SHA" \
            --title "build ${SHORT_SHA}" \
            --notes "Сборка коммита ${GITHUB_SHA}: $(git log -1 --pretty=%s)

          Прошивка: \`espflash write-bin 0x0 soundwave.bin\` (или \`espflash flash --monitor soundwave.elf\`)"
